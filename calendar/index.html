<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>予定カレンダー</title><style>:root{--p:#596af6;--bg:#f5f7fb;--line:#e5e7eb;--txt:#1f2937}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}button,input,textarea,select{font:inherit}.app{max-width:1000px;margin:auto;padding:12px 8px 90px}.head,.bar,.card,.agenda{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 35px #1f29371a}.head{padding:14px 16px;margin-bottom:10px}.head h1{margin:0;font-size:27px}.head p{margin:4px 0 0;color:#6b7280;font-size:12px}.bar{display:flex;align-items:center;gap:7px;padding:8px;margin-bottom:10px}.bar b{flex:1;text-align:center;font-size:21px}.bar button,.fab,.save{border:0;background:var(--p);color:white;font-weight:800}.bar button{width:43px;height:42px;border-radius:12px;font-size:22px}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr)}.week div{text-align:center;padding:10px 0;font-size:12px;font-weight:800;border-bottom:1px solid var(--line);color:#6b7280}.day{min-height:100px;padding:5px 3px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}.day:nth-child(7n){border-right:0}.other{background:#fafafa;color:#b7bdc8}.today{background:#fffbea}.sel{outline:2px solid var(--p);outline-offset:-2px}.num{display:flex;width:25px;height:25px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:800}.today .num{background:var(--p);color:#fff}.chip{display:block;width:100%;margin-top:3px;padding:3px 4px;border:0;border-left:4px solid var(--c);border-radius:6px;background:#f4f5ff;text-align:left;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.done{text-decoration:line-through;opacity:.5}.agenda{margin-top:12px;padding:14px}.agenda h2{margin:0 0 8px;font-size:17px}.empty{text-align:center;color:#6b7280;padding:18px}.item{display:grid;grid-template-columns:7px 1fr auto;gap:9px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.line{width:7px;height:43px;border-radius:9px;background:var(--c)}.meta{font-size:12px;color:#6b7280;margin-top:3px}.actions{display:flex;gap:4px}.actions button{border:0;border-radius:8px;padding:7px;background:#f3f4f6;font-size:11px;font-weight:700}.actions .del{color:#e11d48;background:#fff1f2}.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:30px;box-shadow:0 10px 25px #596af666}dialog{width:min(94%,480px);border:0;border-radius:20px;padding:0;box-shadow:0 25px 80px #0005}dialog::backdrop{background:#0f172a88}.modal{padding:18px}.modal h2{margin:0 0 14px}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.colors{display:flex;gap:9px;flex-wrap:wrap}.colors label{margin:0}.colors input{display:none}.dot{display:block;width:29px;height:29px;border-radius:50%;background:var(--c);border:3px solid white;box-shadow:0 0 0 1px #ccc}.colors input:checked+.dot{box-shadow:0 0 0 3px var(--c)}.buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.buttons button{border:0;border-radius:10px;padding:10px 15px;font-weight:800}.cancel{background:#f3f4f6}.save{background:var(--p)}@media(max-width:650px){.day{min-height:76px}.chip{font-size:8px;padding:3px 2px}.head p{display:none}.agenda{border-radius:15px}.item{grid-template-columns:6px 1fr}.actions{grid-column:2}.actions button{font-size:12px}.row{grid-template-columns:1fr}}</style></head><body><main class="app"><section class="head"><h1>予定カレンダー</h1><p>予定はこの端末のブラウザに保存されるよ</p></section><section class="bar"><button id="prev">‹</button><b id="month"></b><button id="next">›</button></section><section class="card"><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="cal" id="cal"></div></section><section class="agenda"><h2 id="ah"></h2><div id="list"></div></section></main><button class="fab" id="add">＋</button><dialog id="dlg"><form class="modal" id="form"><h2 id="dt">予定を追加</h2><input type="hidden" id="id"><div class="field"><label>予定名</label><input id="title" required maxlength="80" placeholder="例：レポート提出"></div><div class="row"><div class="field"><label>日付</label><input id="date" type="date" required></div><div class="field"><label>時間</label><input id="time" type="time"></div></div><div class="field"><label>カテゴリー</label><select id="cat"><option>予定</option><option>大学</option><option>課題</option><option>仕事</option><option>プライベート</option><option>その他</option></select></div><div class="field"><label>色</label><div class="colors" id="colors"></div></div><div class="field"><label>メモ</label><textarea id="memo" rows="3"></textarea></div><div class="buttons"><button type="button" class="cancel" id="cancel">キャンセル</button><button class="save">保存</button></div></form></dialog><script>const K='calendar-events-v1',C=['#596af6','#ec4899','#10b981','#f59e0b','#8b5cf6','#ef4444','#06b6d4'];let E=JSON.parse(localStorage.getItem(K)||'[]'),V=new Date(),S=f(new Date());V.setDate(1);const q=x=>document.getElementById(x),cal=q('cal'),dlg=q('dlg');function f(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function p(s){let a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function save(){localStorage.setItem(K,JSON.stringify(E))}function render(){q('month').textContent=V.getFullYear()+'年 '+(V.getMonth()+1)+'月';cal.innerHTML='';let y=V.getFullYear(),m=V.getMonth(),a=new Date(y,m,1),st=new Date(y,m,1-a.getDay()),today=f(new Date());for(let i=0;i<42;i++){let d=new Date(st);d.setDate(st.getDate()+i);let k=f(d),es=E.filter(e=>e.date===k).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')),x=document.createElement('div');x.className='day'+(d.getMonth()!=m?' other':'')+(k===today?' today':'')+(k===S?' sel':'');x.innerHTML='<span class="num">'+d.getDate()+'</span>';es.slice(0,3).forEach(e=>{let b=document.createElement('button');b.className='chip'+(e.done?' done':'');b.style.setProperty('--c',e.color);b.textContent=(e.time?e.time+' ':'')+e.title;b.onclick=z=>{z.stopPropagation();open(e)};x.appendChild(b)});x.onclick=()=>{S=k;if(d.getMonth()!=V.getMonth())V=new Date(d.getFullYear(),d.getMonth(),1);render();open(null,k)};cal.appendChild(x)}agenda()}function agenda(){let d=p(S),es=E.filter(e=>e.date===S).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));q('ah').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日の予定';q('list').innerHTML='';if(!es.length){q('list').innerHTML='<div class="empty">予定はまだないよ</div>';return}es.forEach(e=>{let x=document.createElement('div');x.className='item';x.style.setProperty('--c',e.color);x.innerHTML='<div class="line"></div><div><b'+(e.done?' style="text-decoration:line-through;opacity:.5"':'')+'>'+esc(e.title)+'</b><div class="meta">'+(e.time?esc(e.time)+'・':'')+esc(e.cat||'予定')+(e.memo?'・'+esc(e.memo):'')+'</div></div>';let a=document.createElement('div');a.className='actions';let done=document.createElement('button');done.textContent=e.done?'戻す':'完了';done.onclick=()=>{e.done=!e.done;save();render()};let ed=document.createElement('button');ed.textContent='編集';ed.onclick=()=>open(e);let del=document.createElement('button');del.className='del';del.textContent='削除';del.onclick=()=>{if(confirm('削除する？')){E=E.filter(v=>v.id!==e.id);save();render()}};a.append(done,ed,del);x.appendChild(a);q('list').appendChild(x)})}function open(e=null,d=S){q('dt').textContent=e?'予定を編集':'予定を追加';q('id').value=e?.id||'';q('title').value=e?.title||'';q('date').value=e?.date||d;q('time').value=e?.time||'';q('cat').value=e?.cat||'予定';q('memo').value=e?.memo||'';q('colors').innerHTML=C.map(c=>'<label><input type="radio" name="color" value="'+c+'" '+((e?.color||C[0])===c?'checked':'')+'><span class="dot" style="--c:'+c+'"></span></label>').join('');dlg.showModal()}q('form').onsubmit=x=>{x.preventDefault();let id=q('id').value,o={id:id||Date.now().toString(),title:q('title').value.trim(),date:q('date').value,time:q('time').value,cat:q('cat').value,memo:q('memo').value.trim(),color:document.querySelector('[name=color]:checked').value,done:id?(E.find(e=>e.id===id)?.done||false):false};E=id?E.map(e=>e.id===id?o:e):[...E,o];S=o.date;let d=p(S);V=new Date(d.getFullYear(),d.getMonth(),1);save();dlg.close();render()};q('prev').onclick=()=>{V.setMonth(V.getMonth()-1);render()};q('next').onclick=()=>{V.setMonth(V.getMonth()+1);render()};q('add').onclick=()=>open();q('cancel').onclick=()=>dlg.close();render();</script></body></html>
